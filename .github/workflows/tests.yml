name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: basefoundry/base-cli
          ref: v0.4.3
          path: .dependencies/base-cli

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .dependencies/base-cli
          python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        env:
          BASE_CLI_SOURCE_DIR: ${{ github.workspace }}/.dependencies/base-cli/lib/python
          PYTHONPATH: .dependencies/base-cli/lib/python:lib/python:cli/python
        run: |
          python -m pytest \
            --cov=cli/python \
            --cov-report=term-missing \
            --cov-report=json:coverage.json
          python -m tests.coverage_gate coverage.json

  bats:
    name: BATS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_BASH_LIBS_DIR: ${{ github.workspace }}/.dependencies/base-bash-libs/lib/bash

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: basefoundry/base-bash-libs
          ref: 6792c29e546ed7a6230046e4d54bfa1474cd3b13
          path: .dependencies/base-bash-libs

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: basefoundry/base-cli
          ref: v0.4.3
          path: .dependencies/base-cli

      - name: Expose standalone Python package checkout as sibling
        run: |
          ln -s "$GITHUB_WORKSPACE/.dependencies/base-cli" "$GITHUB_WORKSPACE/../base-cli"

      - name: Remove flaky hosted-runner apt sources
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/microsoft-prod.sources \
            /etc/apt/sources.list.d/microsoft-prod.list

      - name: Install BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run BATS tests
        run: |
          bats \
            cli/bash/commands/basectl/tests/*.bats \
            lib/bash/runtime/tests/runtime_bashrc.bats \
            lib/bash/version/tests/lib_version.bats \
            lib/shell/completions/tests/completions.bats \
            tests/base_test.bats \
            tests/base_init.bats \
            tests/bootstrap.bats \
            tests/install.bats \
            tests/source_guards.bats

  macos:
    name: macOS smoke tests
    runs-on: macos-14
    timeout-minutes: 25
    env:
      BASE_BASH_LIBS_DIR: ${{ github.workspace }}/.dependencies/base-bash-libs/lib/bash

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: basefoundry/base-bash-libs
          ref: 6792c29e546ed7a6230046e4d54bfa1474cd3b13
          path: .dependencies/base-bash-libs

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: basefoundry/base-cli
          ref: v0.4.3
          path: .dependencies/base-cli

      - name: Expose standalone Python package checkout as sibling
        run: |
          ln -s "$GITHUB_WORKSPACE/.dependencies/base-cli" "$GITHUB_WORKSPACE/../base-cli"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install Homebrew tools
        run: |
          brew install bash bats-core
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Run bootstrap dry-run install-route checks
        run: |
          require_output() {
            case "$1" in
              *"$2"*) ;;
              *)
                printf "Expected bootstrap output to include: %s\n" "$2" >&2
                return 1
                ;;
            esac
          }

          brew_output="$(./bootstrap.sh --dry-run --brew)"
          printf '%s\n' "$brew_output"
          require_output "$brew_output" "basectl setup"
          require_output "$brew_output" "basectl update-profile"

          source_output="$(./bootstrap.sh --dry-run --source --install-dir "$GITHUB_WORKSPACE")"
          printf '%s\n' "$source_output"
          require_output "$source_output" "basectl setup"
          require_output "$source_output" "basectl update-profile"

      - name: Run Base setup and check smoke tests
        run: |
          ./bin/basectl setup --ci base --format json
          ./bin/basectl check --ci base --format json

      - name: Verify shell profile integration
        run: |
          test_home="$(mktemp -d)"
          brew_bash="$(brew --prefix)/bin/bash"

          HOME="$test_home" ./bin/basectl update-profile
          test -f "$test_home/.bash_profile"
          test -f "$test_home/.bashrc"

          env -u BASE_HOME \
            HOME="$test_home" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            "$brew_bash" --rcfile "$test_home/.bashrc" -i -c 'command -v basectl >/dev/null && basectl --version'

      - name: Run prioritized macOS BATS tests
        run: |
          bats \
            cli/bash/commands/basectl/tests/gh.bats \
            cli/bash/commands/basectl/tests/repo.bats \
            cli/bash/commands/basectl/tests/setup-common.bats \
            cli/bash/commands/basectl/tests/setup.bats \
            cli/bash/commands/basectl/tests/update-profile.bats \
            cli/bash/commands/basectl/tests/workspace.bats \
            lib/bash/version/tests/lib_version.bats \
            lib/shell/completions/tests/completions.bats \
            tests/base_init.bats \
            tests/install.bats

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_BASH_LIBS_DIR: ${{ github.workspace }}/.dependencies/base-bash-libs/lib/bash
      BASE_CLI_SOURCE_DIR: ${{ github.workspace }}/.dependencies/base-cli/lib/python

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: basefoundry/base-bash-libs
          ref: 6792c29e546ed7a6230046e4d54bfa1474cd3b13
          path: .dependencies/base-bash-libs

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: basefoundry/base-cli
          ref: v0.4.3
          path: .dependencies/base-cli

      - name: Expose standalone Python package checkout as sibling
        run: |
          ln -s "$GITHUB_WORKSPACE/.dependencies/base-cli" "$GITHUB_WORKSPACE/../base-cli"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Remove flaky hosted-runner apt sources
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/microsoft-prod.sources \
            /etc/apt/sources.list.d/microsoft-prod.list

      - name: Install dependencies
        run: |
          python -m venv .integration-venv
          .integration-venv/bin/python -m pip install --upgrade pip
          .integration-venv/bin/python -m pip install --no-deps .dependencies/base-cli
          .integration-venv/bin/python -m pip install -r requirements-dev.txt
          mkdir -p "$HOME/.base.d/base"
          python -m venv "$HOME/.base.d/base/.venv"
          "$HOME/.base.d/base/.venv/bin/python" -m pip install --upgrade pip
          "$HOME/.base.d/base/.venv/bin/python" -m pip install --no-deps .dependencies/base-cli
          "$HOME/.base.d/base/.venv/bin/python" -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run basectl --ci smoke check
        run: |
          ./bin/basectl check --ci base --format json

      - name: Run integration tests
        env:
          BASE_INTEGRATION_PYTHON: ${{ github.workspace }}/.integration-venv/bin/python
        run: |
          bats tests/integration/base_workflows.bats

  ubuntu-source-checkout:
    name: Ubuntu source-checkout suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_BASH_LIBS_DIR: ${{ github.workspace }}/.dependencies/base-bash-libs/lib/bash
      BASE_CLI_SOURCE_DIR: ${{ github.workspace }}/.dependencies/base-cli/lib/python

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: basefoundry/base-bash-libs
          ref: 6792c29e546ed7a6230046e4d54bfa1474cd3b13
          path: .dependencies/base-bash-libs

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: basefoundry/base-cli
          ref: v0.4.3
          path: .dependencies/base-cli

      - name: Expose reusable Bash library checkout as sibling
        run: |
          ln -s "$GITHUB_WORKSPACE/.dependencies/base-bash-libs" "$GITHUB_WORKSPACE/../base-bash-libs"

      - name: Expose standalone Python package checkout as sibling
        run: |
          ln -s "$GITHUB_WORKSPACE/.dependencies/base-cli" "$GITHUB_WORKSPACE/../base-cli"

      - name: Remove flaky hosted-runner apt sources
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/microsoft-prod.sources \
            /etc/apt/sources.list.d/microsoft-prod.list

      - name: Install Ubuntu source-checkout prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            build-essential \
            ca-certificates \
            python3-venv \
            python3-pip \
            bats \
            shellcheck \
            jq \
            golang-go

      - name: Prepare Base test virtual environment
        run: |
          mkdir -p "$HOME/.base.d/base"
          python3 -m venv "$HOME/.base.d/base/.venv"
          "$HOME/.base.d/base/.venv/bin/python" -m pip install --upgrade pip
          "$HOME/.base.d/base/.venv/bin/python" -m pip install --no-deps .dependencies/base-cli
          "$HOME/.base.d/base/.venv/bin/python" -m pip install -r requirements-dev.txt

      - name: Run Ubuntu source-checkout validation
        run: |
          ./bin/basectl check --ci base --format json
          branch_payload="$(./bin/basectl gh branch stale --days 999999 --format json)"
          jq -e \
            '.schema_version == 1 and .command == "gh branch stale" and .status == "ok" and .data.branches == [] and .error == null' \
            <<<"$branch_payload"
          env -u BASE_HOME ./bin/base-test

  security:
    name: Security scanners
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: basefoundry/base-cli
          ref: v0.4.3
          path: .dependencies/base-cli

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Remove flaky hosted-runner apt sources
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/microsoft-prod.sources \
            /etc/apt/sources.list.d/microsoft-prod.list

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .dependencies/base-cli
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --show-error --silent --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" |
            sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"

      - name: Scan repository history for secrets
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: |
          ./tests/scan-secrets.sh

      - name: Run Bandit
        run: |
          bandit -q -r cli/python lib/python -x '*/tests/*' --severity-level medium

      - name: Run pip-audit
        run: |
          # Start from -r requirements-dev.txt, but omit base-cli because it
          # is checked out locally and may not be published during review.
          grep -Eiv '^base-cli[[:space:]]*=' requirements-dev.txt \
            > "$RUNNER_TEMP/base-audit-requirements.txt"
          python -m pip_audit --cache-dir "$RUNNER_TEMP/pip-audit" \
            -r "$RUNNER_TEMP/base-audit-requirements.txt"

      - name: Run ShellCheck
        run: |
          git ls-files -z \
            '*.sh' \
            'base_init.sh' \
            'install.sh' \
            'lib/bash/runtime/bashrc' \
            'bin/*' \
            | xargs -0 shellcheck --severity=error

      - name: Run ShellCheck warnings
        continue-on-error: true
        run: |
          git ls-files -z \
            '*.sh' \
            'base_init.sh' \
            'install.sh' \
            'lib/bash/runtime/bashrc' \
            'bin/*' \
            | xargs -0 shellcheck --severity=warning --format=tty
