name: Release Train Policy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-preflight:
    name: Local release-train preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install policy dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Run local release-train preflight
        run: python tools/release_train_check.py --format json

  hosted-preflight:
    name: Hosted release-train readback
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install policy dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Run hosted release-train preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_train_check.py --remote --format json
