name: Bug report
description: Report a reproducible defect in Base
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, personal data, or vulnerability details. Use the private security path for security reports.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the release, package revision, or commit that exhibits the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, shell/runtime, architecture, and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest commands or steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact credentials, tokens, personal data, and private paths before posting.
      render: shell
